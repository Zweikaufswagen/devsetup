name: Test devsetup
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Regression checks
        shell: ${{ matrix.shell }}
        run: ./tests/Test-DevSetup.ps1
